  const photoTasks=new Map();
  const photoInput=(id,previewId,setValue)=>{
   const input=$(id),preview=$(previewId);let revision=0,previewUrl='',savedPreview=preview.getAttribute('src')||'';preview.className='product-photo-preview';preview.alt='Product photo preview';preview.style.display=savedPreview?'block':'none';
   const clear=document.createElement('button');clear.type='button';clear.className='btn d sm';clear.textContent='Remove photo';clear.setAttribute('aria-label','Remove '+(id==='#pi'?'primary':id==='#pif'?'front':'back')+' product photo');preview.after(clear);
   clear.onclick=()=>{revision++;photoTasks.delete(id);setValue('');input.value='';if(previewUrl)URL.revokeObjectURL(previewUrl);previewUrl='';savedPreview='';preview.removeAttribute('src');preview.style.display='none'};
   input.onchange=e=>{

    const task=new Promise(resolve=>{

     const reader=new FileReader();reader.onerror=()=>fail('Could not read that image.');
     reader.onload=()=>{
      if(current!==revision)return resolve(true);

      image.onload=()=>{
      if(current!==revision)return resolve(true);
      const scale=Math.min(1,1400/image.naturalWidth,1400/image.naturalHeight),canvas=document.createElement('canvas');
      canvas.width=Math.round(image.naturalWidth*scale);canvas.height=Math.round(image.naturalHeight*scale);
      const context=canvas.getContext('2d');if(!context)return fail('Could not prepare the image.');
      const draw=()=>{context.fillStyle='#fff';context.fillRect(0,0,canvas.width,canvas.height);context.drawImage(image,0,0,canvas.width,canvas.height)};
      const encode=quality=>canvas.toBlob(blob=>{
       if(!blob)return fail('Could not prepare the image.');
       if(blob.size>700e3&&canvas.width>400){canvas.width=Math.max(400,Math.round(canvas.width*.8));canvas.height=Math.max(1,Math.round(canvas.width*image.naturalHeight/image.naturalWidth));draw();return encode(Math.max(.55,quality-.08))}
       if(blob.size>700e3)return fail('This image cannot be compressed below 700KB.');

       result.readAsDataURL(blob)
      },'image/jpeg',quality);
      draw();encode(.84)
     };
     image.src=reader.result
    };

 $('#vf').onsubmit=async e=>{e.preventDefault();const f=e.target,fi=$('#vfile').files[0];if(fi&&fi.size>10e6)return toast('Video exceeds 10MB.');if(fi&&!['video/mp4','video/webm','video/ogg'].includes(fi.type))return toast('Use MP4, WebM, or OGG.');let data=null;if(fi)data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(fi)});try{await A('POST','/videos',{title:f.title.value,description:f.description.value,product_id:f.product_id.value?+f.product_id.value:null,video_url:f.video_url.value.trim(),video_data:data});toast('Video uploaded.');adminVideos()}catch(x){toast(x.message)}}}

async function carev(){const [cj,oj]=await Promise.all([A('GET','/customers'),A('GET','/orders?q=&pay=&status=')]);const customers=cj.items||[],orders=oj.items||[];$('#ab').innerHTML=`<div class="card"><h3 style="margin-top:0">📞 Customer Care</h3><p>Customer Care staff answer calls and WhatsApp messages and help customers with orders and payments. They cannot change prices or products.</p></div><h3>Customers</h3>${customers.length?`<div class="tbl"><table><tr><th>Customer</th><th>Orders</th><th>Spent</th><th>Contact</th></tr>${customers.map(c=>`<tr><td>${esc(c.name)}<br><small>${esc(c.phone)}</small></td><td>${c.orders}</td><td>${money(c.spent)}</td><td><div class="row"><a class="btn s sm" href="tel:${esc(c.phone)}">📞 Call</a><a class="btn s sm" target="_blank" rel="noopener" href="${waLink('Hello '+c.name+', this is Customer Care at '+CFG.name)}">💬 WhatsApp</a></div></td></tr>`).join('')}</table></div>`:'<div class="empty">No customers yet.</div>'}<h3 style="margin-top:18px">Recent Orders</h3>${orders.length?orders.slice(0,30).map(o=>`<div class="card" style="margin-bottom:8px"><b>${esc(o.no)}</b> · ${money(o.total)}<br>${esc(o.customer)} · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><br><small>${esc(o.address)}, ${esc(o.city)}, ${esc(o.state)}</small><div class="row" style="margin-top:8px"><span class="tag">Payment: ${lab(o.pay_status)}</span><span class="tag">${lab(o.status)}</span><a class="btn s sm" target="_blank" rel="noopener" href="${waLink('Hello '+o.customer+', I am contacting you from Customer Care about order '+o.no)}">WhatsApp</a></div></div>`).join(''):'<div class="empty">No orders yet.</div>'}`}

async function staffv(){let h='';
 if(ME.role=='owner'){const j=await A('GET','/staff');h+=`<h3>Team</h3><div class="tbl"><table><tr><th>Name</th><th>Role</th><th></th></tr>${j.items.map(s=>`<tr><td>${esc(s.name)}<br><small>${esc(s.email)}${s.active?'':' (disabled)'}</small></td><td>${lab(s.role)}</td><td>${s.role=='owner'?'':`<div class="row"><select aria-label="Role for ${esc(s.name)}" onchange="stf(${s.id},{role:this.value})"><option value="admin" ${s.role=='admin'?'selected':''}>Admin</option><option value="staff" ${s.role=='staff'?'selected':''}>Staff</option><option value="customer_care" ${s.role=='customer_care'?'selected':''}>Customer Care</option></select><button class="btn s sm" onclick="stf(${s.id},{active:${s.active?0:1}})">${s.active?'Disable':'Enable'}</button><button class="btn d sm" onclick="rst(${s.id})">Reset password</button></div>`}</td></tr>`).join('')}</table></div>
 <div class="card" style="margin-top:10px"><h3 style="margin-top:0">Add team member</h3><form id="nf"><label>Name</label><input name="name"><label>Email</label><input name="email" type="email"><label>Temporary password (min 10 characters)</label><input name="password" autocomplete="off"><label>Role</label><select name="role"><option value="staff">Staff</option><option value="customer_care">Customer Care</option><option value="admin">Admin</option></select><button class="btn" style="margin-top:10px">Create</button></form></div>`}
 h+=`<div class="card" style="margin-top:10px"><h3 style="margin-top:0">Change my password</h3><form id="pw"><label>Current password</label><input name="current" type="password" autocomplete="current-password"><label>New password (min 10 characters)</label><input name="new" type="password" autocomplete="new-password"><button class="btn" style="margin-top:10px">Change password</button></form></div>`;
 $('#ab').innerHTML=h;
 if($('#nf'))$('#nf').onsubmit=async e=>{e.preventDefault();try{await A('POST','/staff',Object.fromEntries(new FormData(e.target)));toast('Team member created');admin()}catch(x){toast(x.message)}};
 $('#pw').onsubmit=async e=>{e.preventDefault();try{await A('POST','/password',Object.fromEntries(new FormData(e.target)));toast('Password changed');e.target.reset()}catch(x){toast(x.message)}}}
async function stf(id,b){try{await A('PATCH','/staff/'+id,b);toast('Updated');admin()}catch(e){toast(e.message);admin()}}
async function rst(id){if(!confirm('Reset this password? They will be signed out.'))return;try{const r=await A('POST',`/staff/${id}/reset`);prompt('Temporary password (shown once). Give it to them privately:',r.temp_password)}catch(e){toast(e.message)}}
new MutationObserver(()=>{let n=0;document.querySelectorAll('label').forEach(l=>{const c=l.nextElementSibling;if(c&&/^(INPUT|SELECT|TEXTAREA)$/.test(c.tagName)&&!l.htmlFor){if(!c.id)c.id='f'+(++n)+Math.random().toString(36).slice(2,6);l.htmlFor=c.id}})}).observe(document.body,{childList:true,subtree:true});
function route(){const pm=/^\/product\/(\d+)/.exec(location.pathname),h=pm?'/p/'+pm[1]:(location.hash.slice(1)||'/'),[,a,b]=h.split('/');chrome();scrollTo(0,0);
 try{a==''?shop():a=='p'?prod(b):a=='cart'?cart():a=='checkout'?checkout():a=='order'?order(b):a=='track'?track():a=='videos'?videos():a=='admin'?admin():shop()}catch(e){console.error(e);$('#app').innerHTML='<div class="empty"><h3>Something went wrong</h3><button class="btn" onclick="go(\'/\')">Back to store</button></div>'}}
async function boot(){try{CFG=await api('GET','/settings')}catch{}const sp=new URLSearchParams(location.search),ref=sp.get('reference')||sp.get('trxref'),no=sp.get('no');
 if(ref&&no){history.replaceState(null,'','/#/order/'+no);try{await api('GET','/pay/verify?reference='+encodeURIComponent(ref));PAYMENT_NOTICE=''}catch(e){PAYMENT_NOTICE='Payment confirmation is temporarily unavailable. Refresh this order status before trying again.';console.error('Paystack verification failed:',e.message)}}
 addEventListener('popstate',route);addEventListener('hashchange',route);route()}
boot();
</script></body></html>
